<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📸 Smart Image Slider</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f8f9fa;
      color: #212529;
      font-family: "Poppins", sans-serif;
    }
    h3 {
      font-weight: 700;
      color: #0d6efd;
    }
    .carousel-inner img {
      border-radius: 15px;
      width: 100%;
      height: 550px;
      object-fit: cover;
    }
    .carousel,
    .carousel-inner,
    .carousel-item {
      background: none !important;
    }
    .btn-custom {
      border-radius: 10px;
      font-weight: 600;
    }
  </style>
</head>
<body class="container py-4">

  <h3 class="text-center mb-3">📸 Smart Image Slider</h3>

  <div id="slider" class="carousel slide">
    <div class="carousel-inner" id="slides"></div>
    <button class="carousel-control-prev" type="button" onclick="prevSlide()">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" onclick="nextSlide()">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

  <p class="text-center mt-2 fw-bold" id="caption"></p>
  <p class="text-center fw-semibold" id="counter"></p>

  <div class="mt-3">
    <input type="text" id="imgURL" placeholder="🔗 Enter Image URL" class="form-control mb-2">
    <input type="text" id="imgCaption" placeholder="📝 Enter Caption" class="form-control mb-2">
    <button class="btn btn-primary w-100 btn-custom" onclick="addImage()">➕ Add Image</button>
  </div>

  <script>
    let imageList = [
      { img: "https://images.pexels.com/photos/1174732/pexels-photo-1174732.jpeg", caption: "🌅 Paradise found in every wave 🌊" },
      { img: "https://images.pexels.com/photos/618833/pexels-photo-618833.jpeg", caption: "🌄 Frozen peaks kissing the morning light." },
      { img: "https://images.pexels.com/photos/421759/pexels-photo-421759.jpeg", caption: "🍃 A moment of calm beneath green canopies." }
    ];

    let currentIndex = 0;

    function showSlide(index) {
      let slideBox = document.getElementById("slides");
      slideBox.innerHTML = `
        <div class="carousel-item active">
          <img src="${imageList[index].img}" class="d-block w-100" alt="Slide">
        </div>`;
      
      document.getElementById("caption").innerText = imageList[index].caption;
      document.getElementById("counter").innerText = `📍 Slide ${index + 1} of ${imageList.length}`;

      console.log(`Slide ${index + 1}: ${imageList[index].caption}`);
    }

    function nextSlide() {
      if (currentIndex < imageList.length - 1) {
        currentIndex++;
      } else {
        alert("⚠️ This is the last slide!");
        console.log("Message: This is the last slide.");
      }
      showSlide(currentIndex);
    }

    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
      } else {
        alert("⚠️ This is the first slide!");
        console.log("Message: This is the first slide.");
      }
      showSlide(currentIndex);
    }

    function addImage() {
      let url = document.getElementById("imgURL").value;
      let caption = document.getElementById("imgCaption").value;

      if (url && caption) {
        imageList.push({ img: url, caption: caption });
        currentIndex = imageList.length - 1;
        showSlide(currentIndex);
        console.log("✅ New Image Added:", caption);

        document.getElementById("imgURL").value = "";
        document.getElementById("imgCaption").value = "";
      } else {
        alert("⚠️ Please enter both URL and Caption!");
      }
    }

    showSlide(currentIndex);
  </script> 
</body>
</html>
