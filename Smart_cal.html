<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Calculator</title>
    <link rel="stylesheet" href="./Smart_cal.css">
</head>
<body>
    <div class="container">
        <input type="text" placeholder="0" id="display">
        
        <div class="row">
            <button class="operator" onclick="toClear()">AC</button>
            <button class="operator" onclick="toDel()">DEL</button>
            <button class="square" onclick="square()">n²</button>
            <button class="cube" onclick="cube()">n³</button>
        </div>

        <div class="row">
            <button class="factorial" onclick="factorial()">n!</button>
            <button class="evenodd" onclick="evenOdd()">E/O</button>
            <button class="operator" onclick="toDisplay('%')">%</button>
            <button class="operator" onclick="toDisplay('/')">÷</button>
        </div>

        <div class="row">
            <button class="number" onclick="toDisplay('7')">7</button>
            <button class="number" onclick="toDisplay('8')">8</button>
            <button class="number" onclick="toDisplay('9')">9</button>
            <button class="operator" onclick="toDisplay('*')">x</button>
        </div>

        <div class="row">
            <button class="number" onclick="toDisplay('4')">4</button>
            <button class="number" onclick="toDisplay('5')">5</button>
            <button class="number" onclick="toDisplay('6')">6</button>
            <button class="operator" onclick="toDisplay('-')">-</button>
        </div>

        <div class="row">
            <button class="number" onclick="toDisplay('1')">1</button>
            <button class="number" onclick="toDisplay('2')">2</button>
            <button class="number" onclick="toDisplay('3')">3</button>
            <button class="operator" onclick="toDisplay('+')">+</button>
        </div>

        <div class="row">
            <button class="number" onclick="toDisplay('00')">00</button>
            <button class="number" onclick="toDisplay('0')">0</button>
            <button class="number" onclick="toDisplay('.')">.</button>
            <button class="equalTo" onclick="calc()">=</button>
        </div>
    </div>

    <script src="./Smart_cal.js"></script>
</body>
</html>
