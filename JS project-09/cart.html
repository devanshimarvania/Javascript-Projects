<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Cart</title>
  <link rel="stylesheet" href="./assets/CSS/bootstrap.min.css">
  <link rel="stylesheet" href="./assets/css/fonts.css">
  <style>
    body {
      background: #fffdf9;
      font-family: 'Poppins', sans-serif;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: 'Quicksand', sans-serif;
    }

    .navbar {
      background: #d62828 !important;
    }

    .navbar-brand {
      color: #fff !important;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">🍴 Foodies Hub</a>
      <ul class="nav">
        <li class="nav-item"><a class="nav-link text-white" href="./index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="./addProducts.html">Manage Menu</a></li>
      </ul>
    </div>
  </nav>

  <section class="d-flex flex-column align-items-center mt-5">
    <h1 class="mb-4">🛒 Your Cart</h1>
    <table class="table table-bordered border-dark w-75 text-center">
      <thead class="table-dark">
        <tr>
          <th>Sr No.</th>
          <th>ID</th>
          <th>Name</th>
          <th>Category</th>
          <th>Size</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Ingredients</th>
          <th>Stock</th>
          <th>Image</th>
          <th>Sub Total</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="cartTable"></tbody>
    </table>
  </section>

  <section class="container text-center my-3">
    <button class="btn btn-danger" onclick="clearCart()">Clear Cart</button>
    <h4 class="mt-3">Total ₹<span id="cartTotal"></span></h4>
  </section>

  <script src="./assets/Js/bootstrap.bundle.min.js"></script>
  <script src="./assets/JS/main.js"></script>
  <script>
    viewCart();
  </script>
</body>

</html>
