<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Task & Habit Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        body {
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            font-family: "Poppins", sans-serif;
        }

        h1 {
            font-weight: 700;
            color: #fff;
        }

        form {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            padding: 25px;
            width: 500px;
            max-width: 90%;
        }

        #taskContainer {
            width: 720px;
        }

        .task-card {
            transition: transform 0.2s ease-in-out;
        }

        .task-card:hover {
            transform: translateY(-4px);
        }

        .dashboard {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        .progress {
            height: 12px;
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <h1>🚀 Smart Task & Habit Tracker</h1>

    <!-- Task Input Form -->
    <form>
        <h4 class="mb-3">➕ Add Task</h4>
        <input type="text" class="form-control mb-2" placeholder="Title" id="taskTitle" />
        <input type="text" class="form-control mb-2" placeholder="Description" id="taskDesc" />
        <input type="text" class="form-control mb-2" placeholder="Category" id="taskCategory" />
        <input type="date" class="form-control mb-2" id="taskDate" />
        <select class="form-control mb-3" id="taskState">
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
            <option value="overdue">Overdue</option>
        </select>
        <button type="button" class="btn btn-primary w-100" onclick="createTask(event)">Add Task</button>
    </form>

    <!-- Search & Filter -->
    <div class="mt-4 d-flex gap-3">
        <input class="form-control w-50" id="searchBar" placeholder="🔍 Search tasks..." onkeyup="searchTasks()">
        <select id="statusFilter" class="form-select w-25" onchange="filterTasks()">
            <option value="all">All</option>
            <option value="completed">Completed</option>
            <option value="pending">Pending</option>
            <option value="overdue">Overdue</option>
        </select>
    </div>

    <!-- Dashboard -->
    <div class="dashboard mt-4 text-center w-25">
        <h3>📊 Dashboard</h3>
        <p id="totalTasks">Total Tasks : 0</p>
        <p id="doneTasks">Completed : 0</p>
        <p id="waitingTasks">Pending : 0</p>
        <p id="lateTasks">Overdue : 0</p>
        <div class="progress mt-2">
            <div class="progress-bar bg-success" id="progressBar" style="width:0%">0%</div>
        </div>
    </div>

    <!-- Task List -->
    <div id="taskContainer" class="mt-4"></div>

    <script src="./Habit_Tracker.js"></script>
</body>

</html>
